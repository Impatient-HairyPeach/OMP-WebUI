<!doctype html>
<html lang="en" data-theme="dark" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OMP WebUI</title>
    <meta name="description" content="Browser workspace for the oh-my-pi (omp) coding agent: real sessions, streaming transcript, tools, skills and extensions." />
    <meta property="og:title" content="OMP WebUI" />
    <meta property="og:description" content="Browser workspace for the oh-my-pi (omp) coding agent." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Paint the palette before first render (same idea as pi-web's THEME_INIT_SCRIPT):
      // tokens change, markup does not, so there is no flash of the wrong theme.
      (function () {
        try {
          var stored = localStorage.getItem('omp_palette');
          var theme = stored && stored !== 'auto'
            ? stored
            : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', theme);
          if (theme === 'light' || theme === 'mist' || theme === 'rose') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          }
        } catch (error) {
          /* keep the dark default */
        }
      })();
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
